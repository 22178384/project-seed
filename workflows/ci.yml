# NOTE: this file belongs in .github/workflows/ci.yml in a real repo.
# It lives here because the template was generated in a sandbox that blocks
# writes to .github/. Copy it:
#     mkdir -p .github/workflows && mv workflows/ci.yml .github/workflows/
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Let you trigger a run from the Actions tab without pushing a commit.
  workflow_dispatch:

# Cancel superseded runs on the same ref. Saves a lot of CI minutes when you
# push three fixup commits in a row.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 3.13 was still RC when I last touched this; drop it if it breaks.
        python-version: ["3.10", "3.11", "3.12"]
        os: [ubuntu-latest, macos-latest, windows-latest]
        exclude:
          # Don't burn CI minutes on the full cross-product; one OS per version
          # is enough. Windows gets 3.11 only, macOS 3.12 only.
          - os: windows-latest
            python-version: "3.10"
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.10"
          - os: macos-latest
            python-version: "3.11"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy --ignore-missing-imports src/

      - name: Test
        run: pytest --cov=src --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        # Only from one matrix cell, otherwise you get six identical uploads.
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn
