# Install once per clone:  pre-commit install
# Run against everything:  pre-commit run --all-files
#
# Versions are pinned with `rev`. Bump them with `pre-commit autoupdate` — but
# read the changelog first, ruff's rule set moves between minor versions.
default_language_version:
  python: python3.10

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=512"]
      - id: mixed-line-ending
        args: ["--fix=lf"]   # keeps diffs sane across Windows/macOS

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.7
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.1
    hooks:
      - id: mypy
        # Keep this list in sync with any deps the type checker needs to see.
        additional_dependencies: []
        args: ["--ignore-missing-imports"]
        files: ^src/

  - repo: local
    hooks:
      - id: pytest-fast
        name: pytest (fast, no coverage)
        entry: python -m pytest -q
        language: system
        pass_filenames: false
        # Only re-run when source or tests changed.
        files: ^(src|tests)/.*\.py$
