[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "txtstat"
version = "0.3.1"
description = "Line/word/char stats with a reading-time estimate."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "22178384" }]
keywords = ["cli", "text", "wc", "statistics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing",
]
# Zero runtime deps on purpose. If you add one, put it here, not in extras.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[project.scripts]
txtstat = "src.cli:main"

[project.urls]
Homepage = "https://github.com/22178384/project-seed"
Issues = "https://github.com/22178384/project-seed/issues"

# Flat layout: the package directory is literally named `src`. That's a bit
# unusual — most templates use `src/<pkgname>/`. It keeps the rename step to
# one edit in pyproject.toml, which is the whole point of this seed.
[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers"
# Tests import `src.*`, so make sure the repo root is on sys.path even when the
# package isn't pip-installed.
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]  # line length is handled by the formatter, not the linter

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_lines = ["if __name__ == .__main__.:", "raise NotImplementedError"]
